<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Translator Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #333; --prim: #00826b; }
        body.dark-mode { --bg: #000000; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 15px; margin: 0; transition: 0.3s; }
        .card { background-color: var(--card); width: 100%; max-width: 450px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header-bg { background: linear-gradient(135deg, #00826b, #004b3e); padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0; }
        #install-banner { background: #00826b; color: white; text-align: center; padding: 12px; font-size: 13px; font-weight: bold; cursor: pointer; display: none; border-radius: 0 0 10px 10px; }
        .nav-section { background: #e0f2f1; padding: 10px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #ddd; }
        .nav-link { text-decoration: none; color: #006d5b; font-size: 11px; font-weight: 700; padding: 5px; }
        .content-area { padding: 20px; }
        #ad-container { margin-bottom: 10px; text-align: center; } /* اشتہار کی جگہ */
        select { width: 48%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: var(--card); color: var(--text); font-size: 13px; }
        textarea { width: 100%; height: 150px !important; padding: 12px; margin: 15px 0 10px 0; border-radius: 12px; border: 1px solid #ddd; background: var(--card); color: var(--text); box-sizing: border-box; resize: none; overflow-y: scroll !important; }
        #output { padding: 15px; background: var(--bg); border-radius: 10px; height: 150px !important; overflow-y: scroll !important; margin-top: 15px; border: 1px solid #ddd; color: var(--text); word-wrap: break-word; }
        .act-btn { flex: 1; padding: 10px; border: 1px solid #ddd; background: var(--card); color: var(--text); cursor: pointer; border-radius: 8px; margin-top: 10px; font-size: 12px; transition: 0.3s; }
        .voice-btn { width: 100%; padding: 12px; background: #f0f0f0; border: 2px solid #00826b; border-radius: 12px; cursor: pointer; font-weight: bold; color: #00826b; margin-top: 5px; transition: 0.3s; }
        .voice-btn.recording { background: #28a745; color: white; border-color: #1e7e34; }
        .playing { background-color: var(--prim) !important; color: white !important; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-bg">
            <div style="font-weight:bold;">🌐 Smart Translator</div>
            <button id="theme-toggle" onclick="toggleTheme()" style="background:none; border:1px solid #fff; color:white; border-radius:10px; cursor:pointer; padding: 5px 10px;">🌙 Dark</button>
        </div>
        <div id="install-banner" onclick="installApp()">📲 Click here to Install App</div>
        
        <div class="nav-section">
            <a href="index.html" class="nav-link">🏠 Home</a>
            <a href="blog.html" class="nav-link">📝 Blog</a>
            <a href="privacy.html" class="nav-link">🛡️ Privacy</a>
            <a href="disclaimer.html" class="nav-link">⚠️ Disclaimer</a>
            <a href="about.html" class="nav-link">ℹ️ About</a>
            <a href="contact.html" class="nav-link">📞 Contact</a>
        </div>
        <div class="content-area">
            <!-- اشتہار کی جگہ -->
            <div id="ad-container"></div>
            
            <div style="display:flex; justify-content:space-between; gap:5px;">
                <select id="sl" onchange="stopAll(); translateText()">
                    <!-- آپ کے تمام آپشنز یہاں موجود ہیں -->
                    <option value="en">English</option><option value="ur">Urdu</option><option value="hi">Hindi</option><option value="ar">Arabic</option>
                    <!-- بقیہ آپشنز -->
                </select>
                <select id="tl" onchange="stopAll(); translateText()">
                    <option value="ur">Urdu</option><option value="en">English</option><option value="hi">Hindi</option><option value="ar">Arabic</option>
                    <!-- بقیہ آپشنز -->
                </select>
            </div>
            <textarea id="input" oninput="translateText()" placeholder="Type here..."></textarea>
            <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤 Voice Recorder</button>
            <div id="output">Result...</div>
            <div style="display:flex; gap:8px;">
                <button class="act-btn" id="copy-btn" onclick="copyText()">Copy</button>
                <button id="listen-btn" class="act-btn" onclick="speakText()">Listen</button>
                <button class="act-btn" onclick="clearAll()">Clear</button>
            </div>
        </div>
    </div>
    <script>
        // ایڈ لاجک: جب ایپ انسٹال ہو تب ہی ایڈ دکھائیں
        const isApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (isApp) {
            // یہاں اپنا ایڈ نیٹ ورک (مثلاً Adsterra) کا کوڈ ڈالیں
            document.getElementById('ad-container').innerHTML = "<small style='color:gray;'>Advertisement</small>"; 
        }

        let debounceTimer;
        const translationCache = new Map();

        async function translateText() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {
                let val = document.getElementById('input').value.trim();
                let sl = document.getElementById('sl').value;
                let tl = document.getElementById('tl').value;
                if(!val) { clearAll(); return; }
                const cacheKey = `${sl}-${tl}-${val}`;
                if (translationCache.has(cacheKey)) {
                    document.getElementById('output').innerText = translationCache.get(cacheKey);
                    return;
                }
                try {
                    let res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(val)}`);
                    let data = await res.json();
                    let result = data[0].map(item => item[0]).join("");
                    translationCache.set(cacheKey, result);
                    document.getElementById('output').innerText = result;
                } catch(e) { document.getElementById('output').innerText = "Error..."; }
            }, 500);
        }

        function stopAll() { window.speechSynthesis.cancel(); document.getElementById('listen-btn').innerText = "Listen"; document.getElementById('listen-btn').classList.remove('playing'); if(window.isRecording) recognition.stop(); }
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('install-banner').style.display = 'block'; });
        function installApp() { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then((choice) => { deferredPrompt = null; }); } }

        let recognition; let isRecording = false;
        function toggleVoice() {
            const btn = document.getElementById('voice-btn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!isRecording) {
                recognition = new SpeechRecognition();
                recognition.lang = document.getElementById('sl').value;
                recognition.interimResults = true;
                recognition.onstart = () => { isRecording = true; btn.innerText = "🔴 Speak now..."; btn.classList.add('recording'); };
                recognition.onresult = (e) => {
                    let transcript = '';
                    for (let i = e.resultIndex; i < e.results.length; ++i) { transcript += e.results[i][0].transcript; }
                    document.getElementById('input').value = transcript;
                    translateText();
                };
                recognition.onend = () => { isRecording = false; btn.innerText = "🎤 Voice Recorder"; btn.classList.remove('recording'); };
                recognition.start();
            } else { recognition.stop(); }
        }
        function speakText() { 
            let text = document.getElementById('output').innerText; 
            let btn = document.getElementById('listen-btn');
            if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); btn.classList.remove('playing'); btn.innerText = "Listen"; return; }
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(text); 
            u.lang = document.getElementById('tl').value; 
            u.rate = 1.2;
            btn.classList.add('playing'); btn.innerText = "Stop";
            u.onend = () => { btn.classList.remove('playing'); btn.innerText = "Listen"; };
            window.speechSynthesis.speak(u);
        }
        function toggleTheme() { document.body.classList.toggle('dark-mode'); const themeBtn = document.getElementById('theme-toggle'); themeBtn.innerText = document.body.classList.contains('dark-mode') ? "☀️ Light" : "🌙 Dark"; }
        function copyText() { navigator.clipboard.writeText(document.getElementById('output').innerText); let btn = document.getElementById('copy-btn'); btn.innerText = "Copied!"; setTimeout(() => btn.innerText = "Copy", 2000); }
        function clearAll() { document.getElementById('input').value = ''; document.getElementById('output').innerText = 'Result...'; }
    </script>
</body>
</html>
