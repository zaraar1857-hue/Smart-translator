<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Translator Pro</title>
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #333; --prim: #00826b; }
        body.dark-mode { --bg: #000000; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; transition: 0.3s; }

        .app-container { width: 95%; max-width: 450px; background: var(--card); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 10px; overflow: hidden; margin-bottom: 20px; }
        .header-bg { background: linear-gradient(135deg, #00826b, #004b3e); padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        
        /* اپڈیٹ شدہ نیویگیشن بار */
        .nav-section { background: #e0f2f1; padding: 10px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #ddd; }
        .nav-link { text-decoration: none; color: #006d5b; font-size: 11px; font-weight: 700; padding: 5px; }

        .content-area { padding: 20px; }
        select { width: 48%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: var(--card); color: var(--text); font-size: 13px; }
        textarea { width: 100%; height: 120px; padding: 12px; margin: 15px 0 10px 0; border-radius: 12px; border: 1px solid #ddd; background: var(--card); color: var(--text); box-sizing: border-box; resize: none; }
        #output { padding: 15px; background: var(--bg); border-radius: 10px; height: 120px; margin-top: 15px; border: 1px solid #ddd; color: var(--text); overflow-y: auto; }
        .act-btn { flex: 1; padding: 10px; border: 1px solid #ddd; background: var(--card); color: var(--text); cursor: pointer; border-radius: 8px; margin-top: 10px; font-size: 12px; }
        .voice-btn { width: 100%; padding: 12px; background: #f0f0f0; border: 2px solid #00826b; border-radius: 12px; cursor: pointer; font-weight: bold; color: #00826b; margin-top: 5px; }
        .voice-btn.recording { background: #28a745; color: white; border-color: #1e7e34; }
        .playing { background-color: var(--prim) !important; color: white !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-bg">
            <div style="font-weight:bold;">🌐 Smart Translator</div>
            <button id="theme-toggle" onclick="toggleTheme()" style="background:none; border:1px solid #fff; color:white; border-radius:10px; cursor:pointer; padding: 5px 10px;">🌙 Dark</button>
        </div>

        <div class="nav-section">
            <a href="index.html" class="nav-link">🏠 Home</a>
            <a href="blog.html" class="nav-link">📝 Blog</a>
            <a href="privacy.html" class="nav-link">🛡️ Privacy</a>
            <a href="disclaimer.html" class="nav-link">⚠️ Disclaimer</a>
            <a href="about.html" class="nav-link">ℹ️ About</a>
            <a href="contact.html" class="nav-link">📞 Contact</a>
        </div>

        <div class="content-area">
            <div style="display:flex; justify-content:space-between; gap:5px;">
                <select id="sl" onchange="translateText()"><option value="en">English</option><option value="ur">Urdu</option></select>
                <select id="tl" onchange="translateText()"><option value="ur">Urdu</option><option value="en">English</option></select>
            </div>
            <textarea id="input" oninput="translateText()" placeholder="Type here..."></textarea>
            <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤 Voice Recorder</button>
            <div id="output">Result...</div>
            <div style="display:flex; gap:8px;">
                <button class="act-btn" id="copy-btn" onclick="copyText()">Copy</button>
                <button id="listen-btn" class="act-btn" onclick="speakText()">Listen</button>
                <button class="act-btn" onclick="clearAll()">Clear</button>
            </div>
        </div>
    </div>
    <script>
        /* آپ کا موجودہ اسکرپٹ یہاں رہے گا */
        function toggleTheme() { document.body.classList.toggle('dark-mode'); }
        // ... بقیہ فنکشنز
    </script>
</body>
</html>
