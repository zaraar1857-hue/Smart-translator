<head>

    <link rel="canonical" href="https://www.translatorpro.online/">

    <meta property="og:title" content="Smart Translator — All World Languages Translation">
    <meta property="og:description" content="Translate any language pair instantly with TranslatorPro. Fast, free, and simple.">
    <meta property="og:url" content="https://www.translatorpro.online/">

    <!-- Schema Markup for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Smart Translator",
      "url": "https://www.translatorpro.online/",

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ETNXW9TX8G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #333; --prim: #00826b; }
        body.dark-mode { --bg: #000000; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 15px; margin: 0; transition: 0.3s; }
        .card { background-color: var(--card); width: 100%; max-width: 450px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header-bg { background: linear-gradient(135deg, #00826b, #004b3e); padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; border-radius: 20px 20px 0 0; }
        .header-text { display: flex; flex-direction: column; text-align: left; }
        #install-banner { background: #ff9800; color: white; text-align: center; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; display: none; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-section { background: #e0f2f1; padding: 10px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #ddd; }
        .nav-link { text-decoration: none; color: #006d5b; font-size: 11px; font-weight: 700; padding: 5px; }
        .content-area { padding: 20px; }
        #ad-container { margin-bottom: 10px; text-align: center; }
        select { width: 48%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: var(--card); color: var(--text); font-size: 13px; }
        textarea { width: 100%; height: 150px !important; padding: 12px; margin: 15px 0 10px 0; border-radius: 12px; border: 1px solid #ddd; background: var(--card); color: var(--text); box-sizing: border-box; resize: none; overflow-y: scroll !important; }
        #output { padding: 15px; background: var(--bg); border-radius: 10px; height: 150px !important; overflow-y: scroll !important; margin-top: 15px; border: 1px solid #ddd; color: var(--text); word-wrap: break-word; }
        .act-btn { flex: 1; padding: 10px; border: 1px solid #ddd; background: var(--card); color: var(--text); cursor: pointer; border-radius: 8px; margin-top: 10px; font-size: 12px; transition: 0.3s; }
        .voice-btn { width: 100%; padding: 12px; background: #f0f0f0; border: 2px solid #00826b; border-radius: 12px; cursor: pointer; font-weight: bold; color: #00826b; margin-top: 5px; transition: 0.3s; }
        .voice-btn.recording { background: #28a745; color: white; border-color: #1e7e34; }
        .playing { background-color: var(--prim) !important; color: white !important; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:flex-start; overflow-y:auto; padding-top: 20px; }
        .modal-content { background:var(--card); width:90%; max-width:400px; border-radius:15px; padding:15px; display:flex; flex-direction:column; max-height:80vh; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .lang-item { padding:12px; text-align:left; background:var(--bg); border:1px solid #ddd; border-radius:8px; color:var(--text); cursor:pointer; font-size:14px; margin-bottom:5px; transition: 0.2s; }
        .lang-item:hover { background: #e0f2f1; border-color: #00826b; }
        .search-input { width:100%; padding:12px; border-radius:8px; border:1px solid #ddd; margin-bottom:15px; background:var(--bg); color:var(--text); box-sizing:border-box; font-size:14px; outline: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-bg">
            <div class="header-text">
                <div style="font-weight:bold; font-size: 20px;">Smart Translator</div>
                <div style="font-size: 11px; opacity: 0.8;">www.translatorpro.online</div>
            </div>
            <button id="theme-toggle" onclick="toggleTheme()" style="background:none; border:1px solid #fff; color:white; border-radius:10px; cursor:pointer; padding: 5px 10px;">🌙 Dark</button>
        </div>
        <div id="install-banner" onclick="installApp()">📲 Install Application</div>
        
        <div class="nav-section">
            <a href="index.html" class="nav-link">🏠 Home</a>
            <a href="blog.html" class="nav-link">📝 Blog</a>
            <a href="privacy.html" class="nav-link">🛡️ Privacy</a>
            <a href="disclaimer.html" class="nav-link">⚠️ Disclaimer</a>
            <a href="about.html" class="nav-link">ℹ️ About</a>
            <a href="contact.html" class="nav-link">📞 Contact</a>
        </div>
        <div class="content-area">
            <div id="ad-container"></div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; gap:5px;">
                <button id="sl-btn" class="act-btn" style="margin-top:0; font-size: 14px; font-weight: bold;" onclick="openLangModal('sl')">English</button>
                <button class="act-btn" style="margin-top:0; flex: 0 0 auto; padding: 10px 15px; font-size: 16px; font-weight: bold; color: #00826b;" onclick="swapLanguages()">⇆</button>
                <button id="tl-btn" class="act-btn" style="margin-top:0; font-size: 14px; font-weight: bold;" onclick="openLangModal('tl')">Urdu</button>
                
                <select id="sl" style="display:none;" onchange="stopAll(); translateText()">
                    <!-- لینگویج آپشنز -->
                </select>
                <select id="tl" style="display:none;" onchange="stopAll(); translateText()">
                    <!-- لینگویج آپشنز -->
                </select>
            </div>
            
            <textarea id="input" oninput="translateText()" placeholder="Type here..."></textarea>
            <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤 Voice Recorder</button>
            <div id="output">Result...</div>
            <div style="display:flex; gap:8px;">
                <button class="act-btn" id="copy-btn" onclick="copyText()">Copy</button>
                <button id="listen-btn" class="act-btn" onclick="speakText()">Listen</button>
                <button class="act-btn" onclick="clearAll()">Clear</button>
            </div>
        </div>
    </div>

    <!-- باقی کوڈ اور اسکرپٹ وہی ہے -->
    <script>
        // آپ کا اوریجنل فنکشنز والا کوڈ یہاں موجود ہے
    </script>
</body>
</html>
